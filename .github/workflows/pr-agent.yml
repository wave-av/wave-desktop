# pr-agent (OSS) caller — public-repo lane (vendored executable).
# Engine: OSS Qodo Merge on our OPENAI_KEY (trial-independent).
# wave-av/wave-foundation is PRIVATE; public callers cannot use its reusable workflows, so the
# executable lane is vendored at ./.github/workflows/_pr-agent.yml (same pattern as
# foundation-gate.yml → _checks.yml). Keep the two aligned with reusable-pr-agent.yml.
name: pr-agent (OSS)
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  # Include event_name so issue_comment runs do not cancel an in-flight pull_request review
  # (workflow concurrency is claimed before any job-level `if` can skip).
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    uses: ./.github/workflows/_pr-agent.yml
    secrets:
      OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
